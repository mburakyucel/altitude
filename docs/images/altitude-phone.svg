<rect x="24" y="534" width="352" height="64" rx="12" fill="#fff" stroke="#d8dde4" stroke-width="1.5" filter="url(#s)"/><text x="40" y="561" font-size="14.5" fill="#1f2328" font-weight="600" text-anchor="start">Build resumable index backfill</text><circle cx="45" cy="579" r="4.5" fill="#b45309"/><text x="56" y="584" font-size="13" fill="#b45309" font-weight="500" text-anchor="start">Needs your call</text>
