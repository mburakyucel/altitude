<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 930" width="400" height="930" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif">
<defs><filter id="s" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity=".08"/></filter><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef0ff"/><stop offset="1" stop-color="#f6f7ff"/></linearGradient></defs>
<rect width="400" height="930" rx="16" fill="#fbfbfd"/>
<clipPath id="r"><rect width="400" height="930" rx="16"/></clipPath><g clip-path="url(#r)">
<rect x="0" y="74" width="400" height="184" fill="url(#sky)"/><line x1="0" y1="74" x2="400" y2="74" stroke="#c9ced6" stroke-dasharray="2 6"/>
<rect x="0" y="258" width="400" height="672" fill="#f8f8fb"/><line x1="0" y1="258" x2="400" y2="258" stroke="#c9ced6" stroke-dasharray="2 6"/>
</g>
<rect x="24" y="20" width="72" height="36" rx="18" fill="#1f2328"/><text x="60" y="44" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">You</text>
<text x="108" y="44" font-size="15" fill="#1f2328" font-weight="500" text-anchor="start">make the executive decisions</text>
<text x="24" y="102" font-size="13" fill="#4f46e5" font-weight="700" text-anchor="start" letter-spacing="1.3">L3 · COORDINATOR</text><text x="24" y="125" font-size="15" fill="#1f2328" font-weight="500" text-anchor="start">Orchestrates the whole project</text>
<rect x="24.0" y="142" width="352" height="94" rx="14" fill="#fff" stroke="#a5b4fc" stroke-width="1.5" filter="url(#s)"/><text x="200" y="174" font-size="19" fill="#1f2328" font-weight="700" text-anchor="middle">Project atlas</text><text x="200" y="198" font-size="15" fill="#59636e" font-weight="400" text-anchor="middle">plans with you · starts tasks</text><text x="200" y="218" font-size="15" fill="#59636e" font-weight="400" text-anchor="middle">answers from your decisions</text>
<text x="24" y="282" font-size="13" fill="#4f46e5" font-weight="700" text-anchor="start" letter-spacing="1.3">L2 · TASK AGENTS</text><text x="24" y="305" font-size="15" fill="#1f2328" font-weight="500" text-anchor="start">One per task, from idea to production</text>
<text x="24" y="336" font-size="13" fill="#4f46e5" font-weight="700" text-anchor="start" letter-spacing="1.3">L1 · HELPER AGENTS</text><text x="24" y="359" font-size="15" fill="#1f2328" font-weight="500" text-anchor="start">Take on focused work for their task</text>
<rect x="24" y="374" width="352" height="68" rx="12" fill="#fff" stroke="#d8dde4" stroke-width="1.5" filter="url(#s)"/><text x="40" y="402" font-size="16" fill="#1f2328" font-weight="600" text-anchor="start">Keep v1 clients working</text><circle cx="45" cy="422" r="5" fill="#4f46e5"/><text x="57" y="427" font-size="14.5" fill="#4f46e5" font-weight="500" text-anchor="start">Writing contract tests</text>
<line x1="40" y1="442" x2="40" y2="526" stroke="#c9ced6" stroke-width="1.5"/><line x1="40" y1="476" x2="52" y2="476" stroke="#c9ced6" stroke-width="1.5"/><rect x="52" y="456" width="324" height="40" rx="10" fill="#fff" stroke="#d8dde4" stroke-width="1.5" filter="url(#s)"/><circle cx="68" cy="476" r="4.5" fill="#0e7490"/><text x="80" y="481" font-size="14.5" fill="#1f2328" font-weight="500" text-anchor="start">Reads the v1 API docs</text><line x1="40" y1="526" x2="52" y2="526" stroke="#c9ced6" stroke-width="1.5"/><rect x="52" y="506" width="324" height="40" rx="10" fill="#fff" stroke="#d8dde4" stroke-width="1.5" filter="url(#s)"/><circle cx="68" cy="526" r="4.5" fill="#0e7490"/><text x="80" y="531" font-size="14.5" fill="#1f2328" font-weight="500" text-anchor="start">Diffs v1 and v2 replies</text>
<rect x="24" y="574" width="352" height="68" rx="12" fill="#fff" stroke="#d8dde4" stroke-width="1.5" filter="url(#s)"/><text x="40" y="602" font-size="16" fill="#1f2328" font-weight="600" text-anchor="start">Build index backfill</text><circle cx="45" cy="622" r="5" fill="#b45309"/><text x="57" y="627" font-size="14.5" fill="#b45309" font-weight="500" text-anchor="start">Needs your call</text>
<line x1="40" y1="642" x2="40" y2="676" stroke="#c9ced6" stroke-width="1.5"/><line x1="40" y1="676" x2="52" y2="676" stroke="#c9ced6" stroke-width="1.5"/><rect x="52" y="656" width="324" height="40" rx="10" fill="#fff" stroke="#d8dde4" stroke-width="1.5" filter="url(#s)"/><circle cx="68" cy="676" r="4.5" fill="#0e7490"/><text x="80" y="681" font-size="14.5" fill="#1f2328" font-weight="500" text-anchor="start">Runs the retry tests</text>
<rect x="24" y="724" width="352" height="68" rx="12" fill="#fff" stroke="#d8dde4" stroke-width="1.5" filter="url(#s)"/><text x="40" y="752" font-size="16" fill="#1f2328" font-weight="600" text-anchor="start">Measure search latency</text><circle cx="45" cy="772" r="5" fill="#4f46e5"/><text x="57" y="777" font-size="14.5" fill="#4f46e5" font-weight="500" text-anchor="start">Benchmarking</text>
<line x1="40" y1="792" x2="40" y2="876" stroke="#c9ced6" stroke-width="1.5"/><line x1="40" y1="826" x2="52" y2="826" stroke="#c9ced6" stroke-width="1.5"/><rect x="52" y="806" width="324" height="40" rx="10" fill="#fff" stroke="#d8dde4" stroke-width="1.5" filter="url(#s)"/><circle cx="68" cy="826" r="4.5" fill="#0e7490"/><text x="80" y="831" font-size="14.5" fill="#1f2328" font-weight="500" text-anchor="start">Replays search traffic</text><line x1="40" y1="876" x2="52" y2="876" stroke="#c9ced6" stroke-width="1.5"/><rect x="52" y="856" width="324" height="40" rx="10" fill="#fff" stroke="#d8dde4" stroke-width="1.5" filter="url(#s)"/><circle cx="68" cy="876" r="4.5" fill="#0e7490"/><text x="80" y="881" font-size="14.5" fill="#1f2328" font-weight="500" text-anchor="start">Profiles p95 latency</text>
</svg>
