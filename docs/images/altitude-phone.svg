<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 878" width="400" height="878" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif">
<defs><filter id="s" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity=".08"/></filter><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef0ff"/><stop offset="1" stop-color="#f6f7ff"/></linearGradient></defs>
<rect width="400" height="878" rx="16" fill="#fbfbfd"/>
<clipPath id="r"><rect width="400" height="878" rx="16"/></clipPath><g clip-path="url(#r)">
<rect x="0" y="70" width="400" height="168" fill="url(#sky)"/><line x1="0" y1="70" x2="400" y2="70" stroke="#c9ced6" stroke-dasharray="2 6"/>
<rect x="0" y="238" width="400" height="640" fill="#f8f8fb"/><line x1="0" y1="238" x2="400" y2="238" stroke="#c9ced6" stroke-dasharray="2 6"/>
</g>
<rect x="24" y="20" width="68" height="34" rx="17" fill="#1f2328"/><text x="58" y="42.5" font-size="15" fill="#fff" font-weight="600" text-anchor="middle">You</text>
<text x="102" y="42" font-size="13.5" fill="#1f2328" font-weight="500" text-anchor="start">make the executive decisions</text>
<text x="24" y="100" font-size="12" fill="#4f46e5" font-weight="700" text-anchor="start" letter-spacing="1.2">L3 · COORDINATOR</text><text x="24" y="121" font-size="14" fill="#1f2328" font-weight="500" text-anchor="start">Orchestrates the whole project</text>
<rect x="24.0" y="136" width="352" height="70" rx="14" fill="#fff" stroke="#a5b4fc" stroke-width="1.5" filter="url(#s)"/><text x="200" y="166" font-size="17" fill="#1f2328" font-weight="700" text-anchor="middle">Project atlas</text><text x="200" y="189" font-size="12" fill="#59636e" font-weight="400" text-anchor="middle">plans with you · starts tasks · answers from your decisions</text>
<text x="24" y="254" font-size="12" fill="#4f46e5" font-weight="700" text-anchor="start" letter-spacing="1.2">L2 · TASK AGENTS</text><text x="24" y="275" font-size="14" fill="#1f2328" font-weight="500" text-anchor="start">One per task, from idea to production</text>
<text x="24" y="302" font-size="12" fill="#4f46e5" font-weight="700" text-anchor="start" letter-spacing="1.2">L1 · HELPER AGENTS</text><text x="24" y="323" font-size="14" fill="#1f2328" font-weight="500" text-anchor="start">Take on focused work for their task</text>
<rect x="24" y="342" width="352" height="64" rx="12" fill="#fff" stroke="#d8dde4" stroke-width="1.5" filter="url(#s)"/><text x="40" y="369" font-size="14.5" fill="#1f2328" font-weight="600" text-anchor="start">Preserve client compatibility</text><circle cx="45" cy="387" r="4.5" fill="#4f46e5"/><text x="56" y="392" font-size="13" fill="#4f46e5" font-weight="500" text-anchor="start">Writing contract tests</text>
