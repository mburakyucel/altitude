<rect x="24" y="680" width="352" height="64" rx="12" fill="#fff" stroke="#d8dde4" stroke-width="1.5" filter="url(#s)"/><text x="40" y="707" font-size="14.5" fill="#1f2328" font-weight="600" text-anchor="start">Measure search latency</text><circle cx="45" cy="725" r="4.5" fill="#4f46e5"/><text x="56" y="730" font-size="13" fill="#4f46e5" font-weight="500" text-anchor="start">Benchmarking</text>
<line x1="42" y1="744" x2="42" y2="832" stroke="#c9ced6" stroke-width="1.5"/><line x1="42" y1="786" x2="58" y2="786" stroke="#c9ced6" stroke-width="1.5"/><rect x="58" y="768" width="318" height="36" rx="10" fill="#fff" stroke="#d8dde4" stroke-width="1.5" filter="url(#s)"/><circle cx="75" cy="786" r="4" fill="#0e7490"/><text x="87" y="790.5" font-size="13" fill="#1f2328" font-weight="500" text-anchor="start">Replays search traffic</text><line x1="42" y1="832" x2="58" y2="832" stroke="#c9ced6" stroke-width="1.5"/><rect x="58" y="814" width="318" height="36" rx="10" fill="#fff" stroke="#d8dde4" stroke-width="1.5" filter="url(#s)"/><circle cx="75" cy="832" r="4" fill="#0e7490"/><text x="87" y="836.5" font-size="13" fill="#1f2328" font-weight="500" text-anchor="start">Profiles p95 latency</text>
</svg>
