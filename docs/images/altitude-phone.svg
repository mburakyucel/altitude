<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 735" width="400" height="735" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif">
<defs><filter id="s" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity=".08"/></filter><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef0ff"/><stop offset="1" stop-color="#f6f7ff"/></linearGradient></defs>
<rect width="400" height="735" rx="16" fill="#fbfbfd"/>
<clipPath id="r"><rect width="400" height="735" rx="16"/></clipPath><g clip-path="url(#r)">
<rect x="0" y="70" width="400" height="172" fill="url(#sky)"/><line x1="0" y1="70" x2="400" y2="70" stroke="#c9ced6" stroke-dasharray="2 6"/>
<rect x="0" y="242" width="400" height="362" fill="#f8f8fb"/><line x1="0" y1="242" x2="400" y2="242" stroke="#c9ced6" stroke-dasharray="2 6"/>
<rect x="0" y="604" width="400" height="131" fill="#f9f7f2"/><line x1="0" y1="604" x2="400" y2="604" stroke="#c9ced6" stroke-dasharray="2 6"/>
</g>
<rect x="24" y="20" width="68" height="34" rx="17" fill="#1f2328"/><text x="58" y="42.5" font-size="15" fill="#fff" font-weight="600" text-anchor="middle">You</text>
<text x="102" y="42" font-size="13" fill="#59636e" font-weight="400" text-anchor="start">sets the goal and makes the calls</text>
<text x="24" y="100" font-size="12" fill="#4f46e5" font-weight="700" text-anchor="start" letter-spacing="1.2">L3 · COORDINATOR</text><text x="24" y="121" font-size="14" fill="#1f2328" font-weight="500" text-anchor="start">Plans with you and runs the project</text>
<rect x="24" y="140" width="352" height="70" rx="14" fill="#fff" stroke="#a5b4fc" stroke-width="1.5" filter="url(#s)"/>
<text x="200" y="170" font-size="15" fill="#1f2328" font-weight="700" text-anchor="middle">Move search to a versioned index</text>
<text x="200" y="192" font-size="13" fill="#59636e" font-weight="400" text-anchor="middle">3 tasks · 1 shipped · 1 call for you</text>
<text x="24" y="272" font-size="12" fill="#4f46e5" font-weight="700" text-anchor="start" letter-spacing="1.2">L2 · TASK AGENTS</text><text x="24" y="293" font-size="14" fill="#1f2328" font-weight="500" text-anchor="start">One per task, from idea to production</text>
<rect x="24" y="312" width="352" height="64" rx="12" fill="#fff" stroke="#d8dde4" stroke-width="1.5" filter="url(#s)"/><text x="40" y="339" font-size="14.5" fill="#1f2328" font-weight="600" text-anchor="start">Preserve client compatibility</text><circle cx="45" cy="357" r="4.5" fill="#4f46e5"/><text x="56" y="362" font-size="13" fill="#4f46e5" font-weight="500" text-anchor="start">Writing contract tests</text>
<rect x="24" y="404" width="352" height="64" rx="12" fill="#fff" stroke="#d8dde4" stroke-width="1.5" filter="url(#s)"/><text x="40" y="431" font-size="14.5" fill="#1f2328" font-weight="600" text-anchor="start">Build resumable index backfill</text><circle cx="45" cy="449" r="4.5" fill="#b45309"/><text x="56" y="454" font-size="13" fill="#b45309" font-weight="500" text-anchor="start">Needs your call</text>
<rect x="24" y="496" width="352" height="64" rx="12" fill="#fff" stroke="#d8dde4" stroke-width="1.5" filter="url(#s)"/><text x="40" y="523" font-size="14.5" fill="#1f2328" font-weight="600" text-anchor="start">Measure search latency</text><circle cx="45" cy="541" r="4.5" fill="#1a7f37"/><text x="56" y="546" font-size="13" fill="#1a7f37" font-weight="500" text-anchor="start">Shipped</text>
<text x="24" y="634" font-size="12" fill="#4f46e5" font-weight="700" text-anchor="start" letter-spacing="1.2">L1 · HELPERS</text><text x="24" y="655" font-size="14" fill="#1f2328" font-weight="500" text-anchor="start">Research, tests and benchmarks on demand</text>
<rect x="73.9" y="690" width="81.2" height="28" rx="14" fill="#fff" stroke="#c9ced6"/><text x="114.5" y="708.5" font-size="13" fill="#1f2328" font-weight="500" text-anchor="middle">Research</text><rect x="163.10000000000002" y="690" width="59.0" height="28" rx="14" fill="#fff" stroke="#c9ced6"/><text x="192.60000000000002" y="708.5" font-size="13" fill="#1f2328" font-weight="500" text-anchor="middle">Tests</text><rect x="230.10000000000002" y="690" width="96.0" height="28" rx="14" fill="#fff" stroke="#c9ced6"/><text x="278.1" y="708.5" font-size="13" fill="#1f2328" font-weight="500" text-anchor="middle">Benchmarks</text>
