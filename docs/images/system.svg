<line x1="810" y1="172" x2="810" y2="192" stroke="#8b949e" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
<rect x="40" y="196" width="920" height="80" rx="14" fill="#1f2328"/><text x="500" y="230" font-size="20" fill="#fff" font-weight="700" text-anchor="middle">altd keeps every record, moves every task and gates every merge</text><text x="500" y="257" font-size="15" fill="#c9d1d9" text-anchor="middle">Agents act on the record only through alt commands that it checks</text>
