<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 468" width="1000" height="468" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif">
