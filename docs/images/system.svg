<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 724" width="1200" height="724" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif">
<defs><filter id="s" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity=".10"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker></defs>
<rect width="1200" height="724" rx="16" fill="#fbfbfd"/>
<rect x="390" y="24" width="420" height="84" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2.5" filter="url(#s)"/><text x="600" y="60" text-anchor="middle" font-size="28" font-weight="700" fill="#111827">You</text><text x="600" y="90" text-anchor="middle" font-size="19" fill="#374151">direction · answers · approvals · Stop</text>
<rect x="40" y="168" width="360" height="112" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5" filter="url(#s)"/><text x="220" y="204" text-anchor="middle" font-size="26" font-weight="700" fill="#111827">L3 · coordinator</text><text x="220" y="234" text-anchor="middle" font-size="19" fill="#374151">one per project, one conversation</text><text x="220" y="262" text-anchor="middle" font-size="19" fill="#374151">never edits code; acts through alt</text>
<rect x="800" y="168" width="360" height="112" rx="14" fill="#f0fdf4" stroke="#059669" stroke-width="2.5" filter="url(#s)"/><text x="980" y="204" text-anchor="middle" font-size="26" font-weight="700" fill="#111827">Routines</text><text x="980" y="234" text-anchor="middle" font-size="19" fill="#374151">autonomous agents</text><text x="980" y="262" text-anchor="middle" font-size="19" fill="#374151">scheduled or event-driven</text>
<rect x="40" y="340" width="1120" height="92" rx="14" fill="#111827" filter="url(#s)"/><text x="600" y="378" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">altd · the daemon: records, task states, dispatch, merge gate</text><text x="600" y="414" text-anchor="middle" font-size="20" fill="#d1d5db">agents act on the records only through alt commands it checks against the task</text>
<rect x="60" y="476" width="300" height="112" rx="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/><rect x="50" y="486" width="300" height="112" rx="14" fill="#ffffff" stroke="#818cf8" stroke-width="2"/><rect x="40" y="496" width="300" height="112" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5" filter="url(#s)"/><text x="190" y="530" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">L2 · task agents</text><text x="190" y="560" text-anchor="middle" font-size="17" fill="#374151">one per task: worktree, branch, PR</text><text x="190" y="588" text-anchor="middle" font-size="17" fill="#374151">sandboxed, no personal keys</text>
<rect x="560" y="496" width="290" height="112" rx="14" fill="#fff1f2" stroke="#e11d48" stroke-width="2.5" filter="url(#s)"/><text x="705" y="530" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">Independent review</text><text x="705" y="560" text-anchor="middle" font-size="18" fill="#374151">complex plans and changes</text><text x="705" y="588" text-anchor="middle" font-size="18" fill="#374151">other engine preferred</text>
<rect x="880" y="496" width="280" height="112" rx="14" fill="#f3f4f6" stroke="#6b7280" stroke-width="2.5" filter="url(#s)"/><text x="1020" y="530" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">GitHub</text><text x="1020" y="560" text-anchor="middle" font-size="18" fill="#374151">pull requests · checks · issues</text><text x="1020" y="588" text-anchor="middle" font-size="18" fill="#374151">merges pass altd's gate</text>
<rect x="40" y="644" width="300" height="60" rx="12" fill="#ffffff" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5"/><text x="190" y="681" text-anchor="middle" font-size="19" fill="#374151">L1 helpers · engine-native</text>
<line x1="190" y1="608" x2="190" y2="640" stroke="#9ca3af" stroke-width="2.5" marker-end="url(#g)"/>
<text x="360" y="681" font-size="17" fill="#6b7280">focused work for a task; its task agent stays accountable</text>
<path d="M470 108 L330 166" stroke="#374151" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="240" y="132" font-size="18" fill="#374151">project chat</text>
<line x1="600" y1="108" x2="600" y2="336" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/><text x="612" y="210" font-size="18" fill="#374151">task chat · answers</text><text x="612" y="232" font-size="18" fill="#374151">approvals · Stop</text>
<path d="M730 108 L870 166" stroke="#374151" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="860" y="132" font-size="18" fill="#374151">briefs and budget</text>
<line x1="220" y1="280" x2="220" y2="336" stroke="#374151" stroke-width="2.5" marker-end="url(#a)" marker-start="url(#a)"/><text x="232" y="314" font-size="17" fill="#374151">start · answer · resume tasks</text>
<line x1="980" y1="280" x2="980" y2="336" stroke="#374151" stroke-width="2.5" marker-end="url(#a)" marker-start="url(#a)"/><text x="992" y="314" font-size="17" fill="#374151">runs ↓ reports ↑</text>
<line x1="190" y1="432" x2="190" y2="492" stroke="#374151" stroke-width="2.5" marker-end="url(#a)" marker-start="url(#a)"/><text x="202" y="456" font-size="17" fill="#374151">dispatch · messages ↓</text><text x="380" y="456" font-size="17" fill="#374151">reply · block · land ↑</text>
<line x1="364" y1="552" x2="556" y2="552" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/><text x="378" y="540" font-size="17" fill="#374151">review request</text>
<line x1="705" y1="432" x2="705" y2="492" stroke="#374151" stroke-width="2.5" marker-end="url(#a)" marker-start="url(#a)"/><text x="717" y="468" font-size="17" fill="#374151">findings</text>
<line x1="1020" y1="432" x2="1020" y2="492" stroke="#374151" stroke-width="2.5" marker-end="url(#a)" marker-start="url(#a)"/><text x="1008" y="468" font-size="17" fill="#374151" text-anchor="end">push · checks · merge</text>
</svg>
