    <script>
      // Apply the persisted theme before first paint ("system" follows the OS scheme).
      try {
        var t = localStorage.getItem("altitude.theme");
        var dark =
          t === "dark" ||
          (t !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.dataset.theme = "dark";
      } catch (e) {}
    </script>
