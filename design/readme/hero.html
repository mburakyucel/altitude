<!doctype html>
<!-- Layout of the README opening loop: the desktop project view with the phone in front of it.
     design/readme/compose.py fills it with each moment's captures and the task view; see design/readme/README.md#opening-loop -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 2240px; height: 1360px; background: transparent; overflow: hidden; }
  .desktop {
    position: absolute; left: 120px; top: 20px; width: 2100px;
    border-radius: 18px; border: 2px solid #d1d9e0;
    box-shadow: 0 6px 24px rgba(15, 23, 42, .14);
  }
  .phone {
    position: absolute; left: 20px; top: 170px; width: 500px;
    border-radius: 56px; border: 14px solid #1f2328;
    box-shadow: 0 28px 70px rgba(15, 23, 42, .35);
  }
  /* The task view on a 2060×1240 canvas: the phone covers the whole sidebar and stops before the conversation. */
  .task .desktop { left: 140px; width: 1890px; }
  .task .phone { left: 30px; top: 180px; width: 440px; border-radius: 50px; border-width: 12px; }
</style>
</head>
<body>
  <img class="desktop" src="../../docs/images/project-desktop.png" alt="">
  <img class="phone" src="../../docs/images/decision-phone.png" alt="">
</body>
</html>
