name: Hosted checks

# Pull requests that the self-hosted `check` does not admit (fork heads and
# authors other than the repository owner) run the same suite on a
# GitHub-hosted runner: read-only token, no secrets, nothing on the owner's
# machine. Altitude integrates a reviewed contribution on a repository branch,
# where the required self-hosted `check` runs before the merge.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  hosted-check:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name != github.repository || github.actor != github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Verify exact commit and install frozen dependencies
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/browsers"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          corepack enable
          python3 --version
          node --version
          pnpm --version
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web exec playwright install --with-deps chromium

      - name: Full deterministic checks
        run: make check

      - name: Retain the failed browser report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-report-${{ github.run_attempt }}
          path: web/ui-artifacts/report
          if-no-files-found: ignore
          retention-days: 7
