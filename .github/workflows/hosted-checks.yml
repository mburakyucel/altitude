name: Checks

# Every pull request, push to main and manual dispatch runs the full suite on GitHub-hosted runners
# with a read-only token and no secrets: each `shard` job runs one disjoint slice of `make check` on
# its own runner, and the `check` job passes only when all of them passed. Altitude requires the PR
# `check` before merging; main runs verify delivery, and release publication requires the push run
# of the tagged commit.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shard:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      # Every shard finishes, so one run reports every failure.
      fail-fast: false
      matrix:
        # `make check-<suite> SHARD=i/n` takes every n-th test from the i-th; each suite lists i = 1..n.
        include:
          - {suite: python, shard: 1/4}
          - {suite: python, shard: 2/4}
          - {suite: python, shard: 3/4}
          - {suite: python, shard: 4/4}
          - {suite: web, shard: 1/6}
          - {suite: web, shard: 2/6}
          - {suite: web, shard: 3/6}
          - {suite: web, shard: 4/6}
          - {suite: web, shard: 5/6}
          - {suite: web, shard: 6/6}
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # #380: a PR run tests GitHub's merge of the pinned base and head, whose tree must equal the head tree.
      - name: Verify the exact candidate
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json, os, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          if os.environ['GITHUB_EVENT_NAME'] == 'pull_request':
              pr = json.load(open(os.environ['GITHUB_EVENT_PATH']))['pull_request']
              base, head = pr['base']['sha'], pr['head']['sha']
              assert git('rev-list', '--parents', '-n', '1', 'HEAD').split()[1:] == [base, head]
              subprocess.run(['git', 'merge-base', '--is-ancestor', base, head], check=True)
              assert git('rev-parse', 'HEAD^{tree}') == git('rev-parse', head + '^{tree}')
          PY

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # The image integration fixtures use the detected ffmpeg converter and Little CMS (docs/DEVELOPMENT.md).
      - name: Install the image converter
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg liblcms2-2
          ffmpeg -version | head -n 1

      # Corepack selects the pinned pnpm from web/package.json only when pnpm starts inside web/.
      - name: Install frozen dependencies and Chromium
        working-directory: web
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/browsers"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          corepack enable
          python3 --version
          node --version
          pnpm --version
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      # A shard has its runner to itself, so Python uses every CPU instead of half.
      - name: Run this shard
        env:
          SUITE: ${{ matrix.suite }}
          SHARD: ${{ matrix.shard }}
        run: make "check-$SUITE" SHARD="$SHARD" WORKERS="$(nproc)"

      - name: Retain the failed browser report
        if: failure() && matrix.suite == 'web'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-report-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: web/ui-artifacts/report
          if-no-files-found: ignore
          retention-days: 7

  # Keep the job id `check` and no `name:`: `alt land` and release.yml select this job by id.
  # It always runs, so a failed, cancelled or skipped shard fails it instead of skipping it.
  check:
    needs: shard
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every shard to pass
        env:
          SHARDS: ${{ needs.shard.result }}
        run: test "$SHARDS" = success
