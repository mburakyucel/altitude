name: Checks

# Every pull request and manual dispatch runs the full suite on GitHub-hosted runners with a read-only
# token and no secrets: each `shard` job runs one disjoint slice of `make check` on its own runner, and
# the `check` job passes only when all of them passed. A push to main runs the full suite too, unless
# `reuse` finds the pull request run that already tested its exact tree. Altitude requires the PR
# `check` before merging; main runs verify delivery, and release publication requires the push run
# of the tagged commit.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a PR cancels that PR's run of the head it replaced, which can no longer merge; runs on
# main and manual runs are never cancelled.
concurrency:
  group: checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # #777: merging an up-to-date PR pushes the tree its PR run just tested in full. Only an exact,
  # same-repository match that leaves the CI setup unchanged sets `run`; any miss or doubt leaves it empty.
  reuse:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      run: ${{ steps.lookup.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # The script first requires that the checkout is the pushed commit.
      - name: Find the run that tested this tree
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: python3 scripts/ci_reuse.py

  shard:
    needs: reuse
    # Runs unless `reuse` succeeded naming a run: on every pull request and manual run, and whenever the lookup fails.
    if: ${{ !cancelled() && (needs.reuse.result != 'success' || needs.reuse.outputs.run == '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      # Every shard finishes, so one run reports every failure.
      fail-fast: false
      matrix:
        # `make check-<suite> SHARD=i/n` takes every n-th test from the i-th; each suite lists i = 1..n.
        include:
          - {suite: python, shard: 1/4}
          - {suite: python, shard: 2/4}
          - {suite: python, shard: 3/4}
          - {suite: python, shard: 4/4}
          - {suite: web, shard: 1/6}
          - {suite: web, shard: 2/6}
          - {suite: web, shard: 3/6}
          - {suite: web, shard: 4/6}
          - {suite: web, shard: 5/6}
          - {suite: web, shard: 6/6}
    env:
      CI: 'true'
      ALTITUDE_BUBBLEWRAP: required
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # #380: a PR run tests GitHub's merge of the pinned base and head, whose tree must equal the head tree.
      - name: Verify the exact candidate
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json, os, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          if os.environ['GITHUB_EVENT_NAME'] == 'pull_request':
              pr = json.load(open(os.environ['GITHUB_EVENT_PATH']))['pull_request']
              base, head = pr['base']['sha'], pr['head']['sha']
              assert git('rev-list', '--parents', '-n', '1', 'HEAD').split()[1:] == [base, head]
              subprocess.run(['git', 'merge-base', '--is-ancestor', base, head], check=True)
              assert git('rev-parse', 'HEAD^{tree}') == git('rev-parse', head + '^{tree}')
          PY

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Image fixtures use ffmpeg/Little CMS; verified HTTPS uses a disposable NSS trust database; the sandbox's
      # socket cases run real bubblewrap.
      - name: Install fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap ffmpeg liblcms2-2 libnss3-tools
          ffmpeg -version | head -n 1

      # Corepack selects the pinned pnpm from web/package.json only when pnpm starts inside web/.
      - name: Install frozen dependencies and Chromium
        working-directory: web
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/browsers"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          corepack enable
          python3 --version
          node --version
          pnpm --version
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      # A shard has its runner to itself, so Python uses every CPU instead of half.
      - name: Run this shard
        env:
          SUITE: ${{ matrix.suite }}
          SHARD: ${{ matrix.shard }}
        run: make "check-$SUITE" SHARD="$SHARD" WORKERS="$(nproc)"

      - name: Retain the failed browser report
        if: failure() && matrix.suite == 'web'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-report-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: web/ui-artifacts/report
          if-no-files-found: ignore
          retention-days: 7

  # Keep the job id `check` and no `name:`: `alt land` and release.yml select this job by id.
  # It always runs, so a failed, cancelled or skipped shard fails it instead of skipping it, unless
  # `reuse` succeeded with the run that tested this tree.
  check:
    needs: [reuse, shard]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every shard to pass, or the run that tested this tree
        env:
          SHARDS: ${{ needs.shard.result }}
          REUSE: ${{ needs.reuse.result }}
          REUSED: ${{ needs.reuse.outputs.run }}
        run: test "$SHARDS" = success || { test "$SHARDS" = skipped && test "$REUSE" = success && test -n "$REUSED"; }
