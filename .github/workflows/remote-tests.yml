name: Remote tests

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: remote-tests-${{ github.repository_id }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Remote tests / Python
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
      BASE_REPOSITORY: ${{ github.repository }}
      CANDIDATE_REPOSITORY: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name || github.repository }}
      BASE_SHA: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}

    steps:
      - name: Validate event identity
        shell: bash
        run: |
          set -euo pipefail

          is_sha() {
            test "${#1}" -eq 40
            case "$1" in
              *[!0-9a-f]*) return 1 ;;
            esac
          }

          is_sha "$EXPECTED_SHA"
          is_sha "$BASE_SHA"
          is_sha "$WORKFLOW_SHA"

          if test "$GITHUB_EVENT_NAME" = pull_request_target; then
            test "$WORKFLOW_SHA" = "$BASE_SHA"
            # Altitude work is pushed to isolated branches in this repository.
            # Fail closed instead of trying to authenticate to a private fork.
            test "$CANDIDATE_REPOSITORY" = "$BASE_REPOSITORY"
          else
            test "$GITHUB_EVENT_NAME" = push
            test "$GITHUB_REF" = refs/heads/main
            test "$EXPECTED_SHA" = "$GITHUB_SHA"
          fi

      - name: Checkout exact candidate
        id: candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # releases/v4, resolved 2026-08-30
        with:
          repository: ${{ env.BASE_REPOSITORY }}
          ref: ${{ env.EXPECTED_SHA }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false
          set-safe-directory: false
          submodules: false
          lfs: false

      - name: Verify exact checkout
        shell: bash
        env:
          CHECKOUT_SHA: ${{ steps.candidate.outputs.commit }}
        run: |
          set -euo pipefail
          test "$CHECKOUT_SHA" = "$EXPECTED_SHA"
          test "$(/usr/bin/git -c core.hooksPath=/dev/null -c core.fsmonitor=false \
            -C candidate rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up supported Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.22.2'
          package-manager-cache: false

      # Keep this check's existing name so the required-check policy keeps applying.
      # PRs run the workflow from their base; an edit here first takes effect on main.
      - name: Run full deterministic checks without repository credentials
        shell: bash
        run: |
          set -euo pipefail
          test_home=$(/usr/bin/mktemp -d "$RUNNER_TEMP/altitude-ci-home.XXXXXX")
          altitude_home=$(/usr/bin/mktemp -d "$RUNNER_TEMP/altitude-ci-state.XXXXXX")
          /usr/bin/chmod 0700 "$test_home" "$altitude_home"
          node_bin=$(/usr/bin/dirname "$(command -v node)")
          cd candidate
          /usr/bin/env -i \
            PATH="$test_home/tools/bin:$node_bin:/usr/local/bin:/usr/bin:/bin" \
            LANG=C.UTF-8 \
            HOME="$test_home" \
            ALTITUDE_HOME="$altitude_home" \
            PLAYWRIGHT_BROWSERS_PATH="$test_home/browsers" \
            PYTHONDONTWRITEBYTECODE=1 \
            PYTHONNOUSERSITE=1 \
            CI=true \
            /bin/bash --noprofile --norc -euo pipefail -c '
              npm install --global --prefix "$HOME/tools" --ignore-scripts pnpm@10.34.5
              pnpm --dir web install --frozen-lockfile
              cd web
              pnpm exec playwright install --with-deps chromium
              cd ..
              /usr/bin/time -p /usr/bin/python3 -m unittest discover tests
              cd web
              /usr/bin/time -p pnpm test
              /usr/bin/time -p pnpm build
              /usr/bin/time -p pnpm ui
            ' 2>&1 | /usr/bin/tee "$RUNNER_TEMP/altitude-check.log"

      - name: Upload fictional test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deterministic-checks-${{ env.EXPECTED_SHA }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/altitude-check.log
            candidate/web/ui-artifacts/report/
            candidate/web/ui-artifacts/results/
